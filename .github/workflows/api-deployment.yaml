name: Build and Deploy to Azure App Service
 
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
 
env:
  JAVA_VERSION: '17'
  APP_SERVICE_NAME: 'ix-lab-microsite-api'         # Replace with your Azure App Service name
  RESOURCE_GROUP: 'your-resource-group'             # Replace with your resource group
  ARTIFACT_NAME: 'ix-lab-microsite-api'
 
jobs:
 
  # ─────────────────────────────────────────────
  # JOB 1: Build & Test
  # ─────────────────────────────────────────────
  build:
    name: Build and Test
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
 
      - name: Build with Maven
        working-directory: ix-lab-microsite-api
        run: mvn clean package -DskipTests=false --batch-mode
 
      - name: Run tests
        working-directory: ix-lab-microsite-api
        run: mvn test --batch-mode
 
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ix-lab-microsite-api/target/*.jar
          retention-days: 5