<section class="stories">

  <div class="stories-container">

    <!-- BREADCRUMB & ACTION BUTTONS -->
    <div class="stories__top-bar" *ngIf="showAdminControls">
      <div class="breadcrumb">
        <a href="#" class="breadcrumb-link">Admin</a>
        <span class="breadcrumb-separator">›</span>
        <a routerLink="/admin" class="breadcrumb-link">Configurations</a>
        <span class="breadcrumb-separator">›</span>
        <a href="#" class="breadcrumb-link active">Stories Configuration</a>
      </div>


    </div>

    <div class="filters">

      <!-- Industry -->
      <app-custom-dropdown label="Industry" [options]="industries" displayKey="industryName"
        (optionSelected)="onIndustrySelected($event)">
      </app-custom-dropdown>

      <!-- Sub Industry -->
      <app-custom-dropdown label="Sub-Industry" [options]="subIndustries" displayKey="subIndustryName"
        (optionSelected)="onSubIndustrySelected($event)">
      </app-custom-dropdown>

      <!-- Value Chain -->
      <app-custom-dropdown label="Value Chain" [options]="valueChains" displayKey="valueChainName">
      </app-custom-dropdown>

       <app-toaster [title]="toastTitle" [message]="toastMessage" [show]="showToast" (closed)="showToast = false">
            </app-toaster>
      <!-- Sort -->
      <!-- <app-custom-dropdown label="Sort by" [options]="['Popular','New & Noteworthy']">
      </app-custom-dropdown> -->

      <!-- Search -->
      <div class="search">
        <input type="text" placeholder="Search" [(ngModel)]="searchTerm" (input)="filterStories()" />
        <button (click)="filterStories()">🔍</button>
      </div>

    </div>

    <!---ARCHIVED STORIES SECTION-->
    <!-- new wrapper Archived Stories-->
    <div class="stories__header">
      <h1 class="stories__title">All Archived ({{ filteredStories.length }})</h1>
    </div>

    <!-- GRID ALL ARCHIVED STORIES------------ -->
    <div class="stories__grid">

      <div class="story-card" *ngFor="let archived of filteredStories" [routerLink]="['/stories', archived.usecaseId]" [queryParams]="{ from: 'archived', page: currentPage }">

        <div class="story-card__media">
          <img [src]="archived.thumbnailImageUrl" alt="">
          <button class="card-menu-btn" (click)="$event.stopPropagation(); toggleMenu(archived, $event)">⋮</button>

          <div class="card-menu" *ngIf="archived.showMenu" (click)="$event.stopPropagation()">

            <button class="menu-item">
              <img [src]="discardIcon" alt="Edit" />
              <span (click)="restoreArchive(archived.usecaseId)">Restore Archive</span>
            </button>
            <!-- <button class="menu-item">
              <img src="assets/icons/favorite.png" alt="Favorite" />
              <span>Add to Favourites</span>
            </button> -->
            <!-- <button class="menu-item">
              <img src="assets/icons/archive.png" alt="Archive" />
              <span >Archive Story</span>
            </button> -->
          </div>
        </div>

        <div class="story-card__content">
          <span class="category">{{ archived.category }}</span>

          <h3>{{ archived.title }}</h3>

          <p>{{ archived.description }}</p>

          <div class="tags">
            <span *ngFor="let tag of archived.tag">{{ tag }}</span>
          </div>

          <!-- Footer row for stories -->
          <div class="story-card__footer">
            <div class="footer-row">
              <div class="footer-item">
                <img src="assets/icons/user_logo.png" alt="user" />
                <span>{{ archived.ownerName }}</span>
              </div>
              <div class="footer-item">
                <img src="assets/icons/time.png" alt="time" />
                <span>{{ archived.duration }} Min</span>
              </div>
            </div>
            <div class="footer-row status">
              <div class="footer-item">
                <img src="assets/icons/review.png" alt="status" />
                <span>{{ archived.status }}</span>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
    <!---ARCHIVED STORIES SECTION-->

    <ng-container>
      <div class="pagination" *ngIf="totalPages > 1">

        <button [routerLink]="['/archived']" [queryParams]="{ page: currentPage - 1 }" [disabled]="currentPage === 1"
          style="border: none;">
          <img [src]="pagination_left" alt="Previous" />
        </button>


        <span *ngFor="let page of [].constructor(totalPages); let i = index" [routerLink]="['/archived']"
          [queryParams]="{ page: i + 1 }" [class.active]="currentPage === i + 1">
          {{ i + 1 }}
        </span>


        <button [routerLink]="['/archived']" [queryParams]="{ page: currentPage + 1 }"
          [disabled]="currentPage === totalPages" style="border: none;">
          <img [src]="pagination_right" alt="Next" />
        </button>
      </div>
    </ng-container>

  </div>
</section>
