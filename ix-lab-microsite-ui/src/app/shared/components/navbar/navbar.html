<header class="navbar">
  <div class="navbar-left" [routerLink]="'/home'" style="cursor: pointer;">
    <img class="logo-icon" src="assets/Accenture Logo.png" alt="Accenture Logo" />
    <div class="logo-text">
      <div class="title">Industry X - Digital</div>
      <div class="title">Manufacturing Experience Zone</div>
    </div>
  </div>

  <nav class="navbar-right">
    <a class="nav-link" [routerLink]="'/home'" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
      Home
    </a>

    <a class="nav-link" [routerLink]="getRoute('stories')" routerLinkActive="active">
      Stories
    </a>

    <a class="nav-link" [routerLink]="'/favourites'" routerLinkActive="active">
      Favourites
    </a>

    <!-- Admin dropdown only for admin/superadmin -->
    <div *ngIf="role === 'admin' || role === 'superadmin'" class="admin-menu" tabindex="0">
      <a routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}" class="admin nav-link"
        (click)="$event.preventDefault(); toggleAdminMenu($event)">
        Admin <span class="arrow">▾</span>
      </a>

      <ul class="admin-options" *ngIf="adminOpen">
        <li>
          <a routerLink="/admin/configuration" (click)="toggleAdminMenu($event)">
            <img src="assets/icons/configurations.png" alt="Configurations" />
            <span>Configurations</span>
          </a>
        </li>
        <li>
          <a routerLink="/dashboard" (click)="toggleAdminMenu($event)">
            <img src="assets/icons/dashboard.png" alt="Dashboard" />
            <span>Dashboard</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Request tab only for superadmin -->
    <a *ngIf="role === 'superadmin'" class="nav-link" [routerLink]="'/request'" routerLinkActive="active">
      Request
    </a>

    <div class="profile">
      <img src="assets/Avatar.png" alt="profile" />
    </div>

    <a class="nav-link" (click)="logout()">
      Logout
    </a>
  </nav>
</header>
