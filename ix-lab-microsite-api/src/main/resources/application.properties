# ================================
# USE CASE DEFAULTS
# ================================
usecase.default.status=DRAFT
usecase.default.page.size=10
usecase.default.sort.field=createdAt
usecase.default.sort.direction=DESC

# ================================
# AZURE BLOB STORAGE
# ================================
azure.blob.container-name=ixmicrositelab
azure.blob.max-file-size-mb=100
spring.servlet.multipart.max-request-size=100MB
storage.root.folder=usecase/artifacts
storage.path.artifacts.demo.videos=usecase/artifacts/Demo Videos/{usecase-id}
storage.path.artifacts.client.credentials=usecase/artifacts/Client Credentials/{usecase-id}
storage.path.artifacts.client.testimonials=usecase/artifacts/Client Testimonials/{usecase-id}
storage.path.banner_Url=usecase/Banner URL/{usecase-id}
storage.path.thumbnail_Url=usecase/Thumbnail URL/{usecase-id}
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=-1

